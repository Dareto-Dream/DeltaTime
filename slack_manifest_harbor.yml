# from https://app.slack.com/app-settings/T0266FRGM/A08EJ0W7N82/app-manifest
display_information:
  name: Deltatime
  description: Track your time on Deltatime!
  background_color: "#de9c0d"
features:
  bot_user:
    display_name: deltatime
    always_online: false
oauth_config:
  redirect_urls:
    - http://localhost:3000/auth/slack/callback
    - https://deltatime.hackclub.com/auth/slack/callback
  scopes:
    user:
      - users.profile:read
      - users.profile:write
      - users:read
      - users:read.email
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false

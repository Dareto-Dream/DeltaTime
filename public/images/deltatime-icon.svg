<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Deltatime logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef5a6b"/>
      <stop offset="100%" stop-color="#9c2745"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- clock face ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="16"/>

  <!-- elapsed-time wedge (the "delta") -->
  <path d="M256,256 L256,96 A160,160 0 0,1 410.55,297.41 Z" fill="#fff6ef"/>

  <!-- hour ticks -->
  <g fill="#ffffff">
    <rect x="249" y="172" width="14" height="28" rx="7"/>
    <rect x="249" y="172" width="14" height="28" rx="7" transform="rotate(90 256 256)"/>
    <rect x="249" y="172" width="14" height="28" rx="7" transform="rotate(180 256 256)"/>
    <rect x="249" y="172" width="14" height="28" rx="7" transform="rotate(270 256 256)"/>
  </g>

  <!-- pivot -->
  <circle cx="256" cy="256" r="15" fill="#ffffff"/>
  <circle cx="256" cy="256" r="6" fill="#9c2745"/>
</svg>
